<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Subscriber Previewer 設定</title>
    <style>
      body {
        max-width: 640px;
        margin: 40px auto;
        padding: 0 24px;
        color: #202124;
        font-family: Arial, sans-serif;
      }

      h1 {
        font-size: 24px;
      }

      label {
        display: block;
        margin: 24px 0 8px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        font: inherit;
      }

      button {
        margin: 16px 8px 0 0;
        padding: 9px 16px;
        font: inherit;
        cursor: pointer;
      }

      #status {
        min-height: 1.5em;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>YouTube Subscriber Previewer 設定</h1>
    <p>請輸入 Google Cloud Console 的 YouTube Data API v3 API Key。Key 只會儲存在這個瀏覽器的擴充功能本機儲存空間。</p>
    <label for="api-key">API Key</label>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false">
    <button id="save" type="button">儲存</button>
    <button id="validate" type="button">驗證 API Key</button>
    <button id="clear" type="button">清除</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="options.js"></script>
  </body>
</html>
